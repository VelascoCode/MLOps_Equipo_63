    params:
      params.yaml:
        hyperparameter_optimization:
          classifiers:
          - RandomForest
          - XGBoost
          - LightGBM
          - MLP
          random_forest:
            n_estimators_min: 50
            n_estimators_max: 400
            max_depth_min: 5
            max_depth_max: 30
            min_samples_split_min: 2
            min_samples_split_max: 20
            min_samples_leaf_min: 1
            min_samples_leaf_max: 10
          xgboost:
            n_estimators_min: 100
            n_estimators_max: 800
            learning_rate_min: 0.01
            learning_rate_max: 0.3
            max_depth_min: 3
            max_depth_max: 10
            min_child_weight_min: 1
            min_child_weight_max: 7
            subsample_min: 0.6
            subsample_max: 1.0
            colsample_bytree_min: 0.6
            colsample_bytree_max: 1.0
          lightgbm:
            n_estimators_min: 100
            n_estimators_max: 800
            learning_rate_min: 0.01
            learning_rate_max: 0.3
            num_leaves_min: 20
            num_leaves_max: 100
            min_child_samples_min: 5
            min_child_samples_max: 50
            subsample_min: 0.6
            subsample_max: 1.0
            colsample_bytree_min: 0.6
            colsample_bytree_max: 1.0
          mlp:
            hidden_layers:
            - (50,)
            - (100,)
            - (50, 50)
            - (100, 50)
            alpha_min: 1e-05
            alpha_max: 0.1
            learning_rate_min: 0.0001
            learning_rate_max: 0.01
        mlflow:
          tracking_uri: file:./mlruns
          experiment_name: News_Popularity_Experiment
        preprocessing.random_state: 12
        preprocessing.test_size: 0.2
        training.cv_folds: 3
        training.n_trials: 30
        training.random_state: 12
    outs:
